<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Complete the Equation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: one centred column. A seesaw tips to show the symbol. The player builds the whole equation: left expression, a symbol from the three buttons in the middle, and right expression. */
:root {
  --bg: #EEF2F8;
  --surface: #FFFFFF;
  --surface-2: #E4EAF5;
  --ink: #14203A;
  --muted: #55617D;
  --line: #C6D0E3;
  --edge: #B3BFD8;
  --accent: #2B50E6;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDE5FF;
  --accent-edge: #1B36A8;
  --good: #137F59;
  --good-soft: #D3F1E4;
  --bad: #C43A3A;
  --bad-soft: #FBDBDB;
  --on-strong: #FFFFFF;
  --display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1424;
    --surface: #172039;
    --surface-2: #223050;
    --ink: #EAF0FF;
    --muted: #9FADCC;
    --line: #30406A;
    --edge: #0A0F1D;
    --accent: #86A1FF;
    --accent-ink: #0E1424;
    --accent-soft: #27386E;
    --accent-edge: #4A63BF;
    --good: #4FD1A0;
    --good-soft: #143B31;
    --bad: #FF8A8A;
    --bad-soft: #4A2226;
    --on-strong: #0E1424;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1424;
  --surface: #172039;
  --surface-2: #223050;
  --ink: #EAF0FF;
  --muted: #9FADCC;
  --line: #30406A;
  --edge: #0A0F1D;
  --accent: #86A1FF;
  --accent-ink: #0E1424;
  --accent-soft: #27386E;
  --accent-edge: #4A63BF;
  --good: #4FD1A0;
  --good-soft: #143B31;
  --bad: #FF8A8A;
  --bad-soft: #4A2226;
  --on-strong: #0E1424;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }

/* header */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.top > div { min-width: 0; }
h1 { margin: 0; font: 800 clamp(1.5rem, 6vw, 1.9rem)/1.05 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
.tagline { margin: 6px 0 0; color: var(--muted); font-size: .92rem; }
.score { text-align: right; flex: none; }
.score-label { display: block; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.score-num { font: 800 1.9rem/1 var(--display); font-variant-numeric: tabular-nums; }

/* progress */
.stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stage-lbl { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin-bottom: 6px; white-space: nowrap; }
.stage.active .stage-lbl { color: var(--ink); }
.dots { display: flex; gap: 4px; }
.dot { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); }
.dot.s1 { background: var(--accent); opacity: .5; }
.dot.s2 { background: var(--accent); opacity: .78; }
.dot.s3 { background: var(--accent); }
.dot.now { background: var(--surface); box-shadow: inset 0 0 0 2px var(--accent); }
.stage-line { margin: 10px 0 0; color: var(--muted); font-size: .92rem; }

/* play card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px 16px; display: grid; gap: 16px; }
.eyebrow { margin: 0; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.lead { margin: 0 0 4px; font-size: 1rem; font-weight: 600; }
.story { margin: 0; font: 700 clamp(1.45rem, 6vw, 2rem)/1.18 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
.story mark { background: var(--accent-soft); color: var(--ink); padding: 0 .22em; border-radius: 7px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; }
.legend li { list-style: none; padding: 3px 11px 3px 9px; border-radius: 999px; background: var(--surface-2); font-size: .85rem; }
.legend b { font: 800 .95rem var(--display); color: var(--accent); margin-right: 6px; }

/* seesaw */
.seesaw { display: block; width: 100%; max-width: 400px; height: auto; margin: 0 auto; }
.seesaw .ground { fill: var(--line); }
.seesaw .fulcrum { fill: var(--muted); }
.seesaw .pivot { fill: var(--surface); stroke: var(--ink); stroke-width: 3; }
.beam { fill: var(--ink); transform-origin: 180px 96px; transition: transform .55s cubic-bezier(.3, 1.5, .5, 1); }
.pan { transition: transform .55s cubic-bezier(.3, 1.5, .5, 1); }
.pan rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.pan text { fill: var(--accent); font: 800 22px var(--display); }
.pan.unknown rect { fill: transparent; stroke-dasharray: 5 4; }
.pan.unknown text { opacity: .65; }

/* equation row */
.eq { display: grid; grid-template-columns: minmax(0, 1fr) 76px minmax(0, 1fr); gap: 10px; height: 172px; }
.side { width: 100%; background: var(--surface); border-radius: 16px; border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; text-align: center; min-width: 0; cursor: pointer; }
.side .sym { font: 800 clamp(2.4rem, 12vw, 3.6rem)/1 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.side.long .sym { font-size: clamp(1.6rem, 7.6vw, 2.2rem); }
.side .cap { font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; line-height: 1.25; }
.side.empty { border-style: dashed; color: var(--muted); }
.side.empty.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.side.filled { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); box-shadow: 0 4px 0 var(--accent-edge); }
.side.filled.active { box-shadow: 0 4px 0 var(--accent-edge), 0 0 0 4px var(--accent-soft); }
.side.good { background: var(--good-soft); border-color: var(--good); color: var(--good); box-shadow: none; cursor: default; }
.side.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); box-shadow: none; }
.side.filled .cap, .side.good .cap, .side.bad .cap, .side.empty .cap { color: inherit; opacity: .85; }

.ops { display: grid; grid-template-rows: repeat(3, 1fr); gap: 8px; }
.ops.single .op { font-size: 2.8rem; cursor: default; }
.op { border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: 800 1.9rem/1 var(--display); box-shadow: 0 3px 0 var(--edge); cursor: pointer; padding: 0; }
.op:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
.op[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 var(--accent-edge); }
.ops.bad .op[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: var(--on-strong); box-shadow: none; }
.ops.good .op[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--on-strong); box-shadow: none; }
.op:disabled { cursor: default; }
.ops.good .op:disabled:not([aria-pressed="true"]) { opacity: .45; }

/* picker */
.picker-label { margin: 0 0 8px; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); gap: 8px; }
.chip { min-height: 62px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); box-shadow: 0 3px 0 var(--edge); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 6px; gap: 0; }
.chip .sym { font: 800 1.6rem/1.1 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.long .sym { font-size: 1.3rem; }
.chip .cap { font-size: .75rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); box-shadow: 0 3px 0 var(--accent-edge); }
.chip[aria-pressed="true"] .cap { color: inherit; }
.chip:disabled { cursor: default; opacity: .6; }
.chip[aria-pressed="true"]:disabled { opacity: 1; }
.chip:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }

/* follow-up: use the equation with a known age */
.follow { display: grid; gap: 10px; }
.follow .picker-label { margin: 0; }
.follow-q { margin: 0; font: 700 1.25rem/1.25 var(--display); text-wrap: balance; }
.follow-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.follow-row label { font-weight: 700; }
#ageInput { width: 96px; height: 54px; border-radius: 12px; border: 2px solid var(--accent); background: var(--surface); color: var(--ink); font: 800 1.6rem var(--display); text-align: center; font-variant-numeric: tabular-nums; }
#ageInput:disabled { border-color: var(--good); color: var(--good); background: var(--good-soft); }

/* feedback + actions */
.feedback { margin: 0; min-height: 2.9em; font-weight: 600; }
.feedback.good { color: var(--good); }
.feedback.bad { color: var(--bad); }
.feedback .eqn { font: 800 1.05rem var(--display); letter-spacing: .02em; white-space: nowrap; }
.feedback .stars { letter-spacing: .1em; white-space: nowrap; }
.hint { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); font-size: .92rem; }
.actions { display: flex; gap: 10px; }
.btn { min-height: 50px; padding: 0 18px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; }
.btn.primary { flex: 1; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 var(--accent-edge); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn:active:not(:disabled) { transform: translateY(2px); }

.shake { animation: shake .36s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

/* finish */
.done-title { margin: 0; font: 800 clamp(1.7rem, 7vw, 2.2rem)/1.1 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
.done-score { margin: 0; font: 800 3rem/1 var(--display); font-variant-numeric: tabular-nums; color: var(--accent); }
.done-score small { font: 600 1rem var(--body); color: var(--muted); margin-left: 6px; }
.breakdown { margin: 0; padding: 0; display: grid; gap: 8px; }
.breakdown li { list-style: none; display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-radius: 12px; background: var(--surface-2); font-weight: 600; }
.breakdown span:last-child { font-variant-numeric: tabular-nums; }
.best { margin: 0; color: var(--muted); font-size: .92rem; }

@media (max-width: 380px) {
  .card { padding: 16px 12px; }
  .eq { grid-template-columns: minmax(0, 1fr) 68px minmax(0, 1fr); gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .beam, .pan { transition: none; }
  .shake { animation: none; }
}

<div id="ov"><h2>Complete the Equation</h2><p>Enter your details, then answer all 10 questions.</p><input id="nm" placeholder="Your name" maxlength="40" autocomplete="name"><input id="cl" placeholder="Class (e.g. 7)" inputmode="numeric" maxlength="2" autocomplete="off"><p id="er"></p><button class="btn primary" type="button" id="startBtn" style="flex:none;width:min(300px,100%)">Start</button></div>

<main class="app">
  <header class="top">
    <div>
      <h1>Complete the Equation</h1>
      <p class="tagline">Read the story, then build the equation with two expressions</p>
    </div>
    <div class="score">

      <span class="score-num" id="score">0</span>
    </div>
  </header>

  <section aria-label="Progress">
    <div class="stages" id="stages"></div>
    <p class="stage-line" id="stageLine"></p>
  </section>

  <section class="card" id="play">
    <p class="eyebrow" id="roundTag"></p>
    <div>
      <p class="lead" id="lead"></p>
      <p class="story" id="story"></p>
    </div>
    <ul class="legend" id="legend" aria-label="What each letter means"></ul>

    <svg class="seesaw" viewBox="0 0 360 142" role="img" aria-label="A seesaw that tips toward the bigger side">
      <rect class="ground" x="20" y="134" width="320" height="4" rx="2"/>
      <path class="fulcrum" d="M180 100 L154 134 L206 134 Z"/>
      <rect class="beam" id="beam" x="40" y="92" width="280" height="8" rx="4"/>
      <circle class="pivot" cx="180" cy="96" r="6"/>
      <g class="pan unknown" id="panL" style="transform:translate(80px,96px)"><rect x="-40" y="-44" width="80" height="40" rx="9"/><text x="0" y="-16" text-anchor="middle">?</text></g>
      <g class="pan unknown" id="panR" style="transform:translate(280px,96px)"><rect x="-40" y="-44" width="80" height="40" rx="9"/><text x="0" y="-16" text-anchor="middle">?</text></g>
    </svg>

    <div class="eq" id="eq">
      <button class="side" type="button" id="slotL" aria-label="Left side of the equation"></button>
      <div class="ops" id="ops" role="group" aria-label="Symbol between the two expressions"></div>
      <button class="side" type="button" id="slotR" aria-label="Right side of the equation"></button>
    </div>

    <div id="pickerWrap">
      <p class="picker-label" id="pickLabel"></p>
      <div class="chips" id="chips" role="group" aria-labelledby="pickLabel"></div>
    </div>

    <div class="follow" id="follow" hidden>
      <p class="picker-label">Now use your equation</p>
      <p class="follow-q" id="followQ"></p>
      <div class="follow-row" id="followRow">

        <span id="ageUnit">items</span>
      </div>
    </div>

    <p class="feedback" id="fb" role="status" aria-live="polite"></p>
    <p class="hint" id="hint" hidden></p>
    <div class="actions">
      <button class="btn" type="button" id="hintBtn">Hint</button>
      <button class="btn" type="button" id="clearBtn">Clear</button>
      <button class="btn primary" type="button" id="mainBtn">Check</button>
    </div>
  </section>

  <section class="card" id="done" hidden>
    <p class="eyebrow">All 10 questions finished</p>
    <h2 class="done-title" id="doneTitle"></h2>

    <p class="best" id="sent"></p>
    <div class="actions"><button class="btn primary" type="button" id="again">Play again</button></div>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  var NAMES = ['Asha','Ben','Chen','Dev','Esi','Farah','Gita','Hugo','Ines','Jo','Kai','Lena','Mo','Nia','Priya','Quinn','Ravi','Sana','Tomas'];
  var OPS = ['<', '=', '>'];
  var OPW = { '>': 'are more than', '<': 'are fewer than', '=': 'equal' };
  var ITEMS = [['marble','marbles'],['sticker','stickers'],['coin','coins'],['pencil','pencils'],['stamp','stamps'],['card','cards']];
  var MINUS = '−';
  var OPS_ENABLED = ['='];   // add '<' and '>' here to bring back the greater and less symbols
  var STAGES = [
    { name: 'Exact gap', line: 'Stage 1: an exact difference. Pick the left and right expressions that make the equation true.' },
    { name: 'Known amount', line: 'Stage 2: one amount is known, so you can write it as its letter or as a number.' },
    { name: 'Mixed', line: 'Stage 3: a mix of both kinds of story.' }
  ];
  var HINTS = [
    "The bigger amount is the smaller amount plus the difference. Ask which expression is equal to the other person's amount.",
    'One amount is a number you already know, so you can write it as its letter or as that number. Find the other amount from the difference.',
    'Decide who has more. The bigger amount is the smaller amount plus the difference, and the smaller amount is the bigger amount minus the difference.'
  ];
  var STAGE_N = [3, 4, 3];
  var STAGE_START = [0, 3, 7];
  var TOTAL = 10;
  var BEST_KEY = 'complete-the-equation-best';

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(a) { return a[rnd(0, a.length - 1)]; }

  /* ---------- expressions: (letter or nothing) + a whole number ---------- */
  function ex(v, k) { return { v: v, k: k || 0 }; }
  function sameEx(a, b) { return !!a && !!b && a.v === b.v && a.k === b.k; }
  function exText(e) {
    if (!e.v) return String(e.k);
    if (!e.k) return e.v;
    return e.v + ' ' + (e.k > 0 ? '+' : MINUS) + ' ' + Math.abs(e.k);
  }
  function exVal(e, env) { return (e.v ? env[e.v] : 0) + e.k; }
  function cmp(op, a, b) { return op === '<' ? a < b : op === '>' ? a > b : a === b; }

  /* ---------- puzzle generators ---------- */
  function solveFor(p, g, gv, a) {
    var env = {}, k, b, sol = [];
    for (k in p.known) env[k] = p.known[k];
    env[g] = gv;
    for (b = 1; b <= 40; b++) { env[a] = b; if (p.truth(env)) sol.push(b); }
    return sol.length === 1 ? sol[0] : null;
  }
  /* one age is fixed to a number, the student finds the other */
  function makeFollow(p) {
    var t, g, a, v, ans;
    if (p.unknown.length === 1) {
      g = Object.keys(p.known)[0]; v = p.known[g]; a = p.unknown[0];
      ans = solveFor(p, g, v, a);
      return ans === null ? null : { mode: 'known', given: g, value: v, ask: a, answer: ans };
    }
    for (t = 0; t < 80; t++) {
      var two = shuffle(p.unknown);
      g = two[0]; a = two[1]; v = rnd(6, 16);
      ans = solveFor(p, g, v, a);
      if (ans !== null && ans >= 2 && ans <= 30) return { mode: 'given', given: g, value: v, ask: a, answer: ans };
    }
    return null;
  }

  /* single-letter expressions first, then the rest */
  function orderPool(list) {
    var singles = list.filter(function (e) { return e.v && !e.k; });
    var rest = list.filter(function (e) { return !(e.v && !e.k); });
    return shuffle(singles).concat(shuffle(rest));
  }

  function yrs(it, n) { return n + ' ' + (n === 1 ? it[0] : it[1]); }

  function pairPuzzle(stage, kind) {
    var pair = shuffle(NAMES).slice(0, 2);
    var s = pair[0], o = pair[1], S = s[0], O = o[0];
    var N = rnd(1, 5), it = pick(ITEMS);
    var story, truth;
    if (kind === 'exact-older') {
      story = s + ' has <mark>' + N + ' more ' + (N === 1 ? it[0] : it[1]) + ' than</mark> ' + o + '.';
      truth = function (e) { return e[S] === e[O] + N; };
    } else if (kind === 'exact-younger') {
      story = s + ' has <mark>' + N + ' fewer ' + (N === 1 ? it[0] : it[1]) + ' than</mark> ' + o + '.';
      truth = function (e) { return e[S] === e[O] - N; };
    } else if (kind === 'more-older') {
      story = s + ' has <mark>more than ' + N + ' more ' + (N === 1 ? it[0] : it[1]) + ' than</mark> ' + o + '.';
      truth = function (e) { return e[S] > e[O] + N; };
    } else if (kind === 'more-younger') {
      story = s + ' has <mark>more than ' + N + ' fewer ' + (N === 1 ? it[0] : it[1]) + ' than</mark> ' + o + '.';
      truth = function (e) { return e[S] < e[O] - N; };
    } else {
      story = s + ' and ' + o + ' have <mark>the same number of ' + it[1] + '</mark>.';
      truth = function (e) { return e[S] === e[O]; };
    }
    var pp = {
      stage: stage, item: it, story: story, lead: s + ' and ' + o + ' are friends who collect ' + it[1] + '.',
      vars: [{ v: S, name: s }, { v: O, name: o }].sort(function (a, b) { return a.v < b.v ? -1 : 1; }),
      unknown: [S, O], known: {}, truth: truth,
      pool: kind === 'same' ? orderPool([ex(S), ex(O)]) : orderPool([ex(S), ex(O), ex(S, N), ex(S, -N), ex(O, N), ex(O, -N)])
    };
    pp.follow = makeFollow(pp);
    return pp;
  }

  function knownPuzzle(stage, kind) {
    var pair = shuffle(NAMES).slice(0, 2);
    var s = pair[0], o = pair[1], S = s[0], O = o[0];
    var X = rnd(9, 16), N = rnd(1, 5), it = pick(ITEMS), iw = N === 1 ? it[0] : it[1];
    var story, truth;
    if (kind === 'exact-older') {
      story = o + ' has <mark>' + N + ' more ' + iw + ' than</mark> ' + s + '.';
      truth = function (e) { return e[O] === X + N; };
    } else if (kind === 'exact-younger') {
      story = o + ' has <mark>' + N + ' fewer ' + iw + ' than</mark> ' + s + '.';
      truth = function (e) { return e[O] === X - N; };
    } else if (kind === 'more-older') {
      story = o + ' has <mark>more than ' + N + ' more ' + iw + ' than</mark> ' + s + '.';
      truth = function (e) { return e[O] > X + N; };
    } else {
      story = o + ' has <mark>more than ' + N + ' fewer ' + iw + ' than</mark> ' + s + '.';
      truth = function (e) { return e[O] < X - N; };
    }
    var known = {}; known[S] = X;
    var kp = {
      stage: stage, item: it, story: story, lead: s + ' has ' + yrs(it, X) + '.',
      vars: [{ v: S, name: s, known: X }, { v: O, name: o }].sort(function (a, b) { return a.v < b.v ? -1 : 1; }),
      unknown: [O], known: known, truth: truth,
      pool: orderPool([ex(O), ex(S), ex(S, N), ex(S, -N), ex(null, X + N), ex(null, X - N), ex(O, N), ex(O, -N)])
    };
    kp.follow = makeFollow(kp);
    return kp;
  }

  function buildQueue() {
    var q = [];
    shuffle(['exact-older', 'exact-younger', 'same']).forEach(function (k) { q.push(pairPuzzle(0, k)); });
    shuffle(['exact-older', 'exact-younger', 'exact-older', 'exact-younger']).forEach(function (k) { q.push(knownPuzzle(1, k)); });
    var mixed = [];
    mixed.push(pairPuzzle(2, pick(['exact-older', 'exact-younger', 'same'])));
    mixed.push(knownPuzzle(2, 'exact-older'));
    mixed.push(knownPuzzle(2, 'exact-younger'));
    return q.concat(shuffle(mixed));
  }

  /* An equation is correct when it is true for exactly the same ages as the story. */
  function isCorrect(p, L, op, R) {
    var env = {}, k, a, b;
    for (k in p.known) env[k] = p.known[k];
    if (p.unknown.length === 2) {
      for (a = 1; a <= 30; a++) for (b = 1; b <= 30; b++) {
        env[p.unknown[0]] = a; env[p.unknown[1]] = b;
        if (cmp(op, exVal(L, env), exVal(R, env)) !== p.truth(env)) return false;
      }
    } else {
      for (a = 1; a <= 40; a++) {
        env[p.unknown[0]] = a;
        if (cmp(op, exVal(L, env), exVal(R, env)) !== p.truth(env)) return false;
      }
    }
    return true;
  }

  /* ---------- text helpers ---------- */
  function nameOf(p, letter) {
    for (var i = 0; i < p.vars.length; i++) if (p.vars[i].v === letter) return p.vars[i].name;
    return letter;
  }
  function words(e, p) {
    if (!e.v) return yrs(p.item, e.k);
    var n = nameOf(p, e.v) + "'s " + p.item[1];
    if (!e.k) return n;
    return Math.abs(e.k) + (e.k > 0 ? ' more than ' : ' fewer than ') + n;
  }
  function capText(e, p) { return e.v ? words(e, p) : p.item[1]; }
  function reading(p, L, op, R) { return words(L, p) + ' ' + OPW[op] + ' ' + words(R, p) + '.'; }
  function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function stars(n) { return new Array(n + 1).join('★') + new Array(4 - n).join('☆'); }

  /* ---------- state ---------- */
  var queue = [], idx = 0, results = [], score = 0;
  var sel = { op: null, L: null, R: null, active: 'L' };
  var bad = { op: false, L: false, R: false };
  var wrong = 0, wrongAge = 0, hintUsed = false, solved = false, followDone = false, fbHtml = '', fbClass = '';

  function buildOps() {
    var ops = $('ops');
    var names = { '<': 'less than', '=': 'equal to', '>': 'greater than' };
    ops.classList.toggle('single', OPS_ENABLED.length === 1);
    ops.style.gridTemplateRows = 'repeat(' + OPS_ENABLED.length + ', 1fr)';
    ops.innerHTML = OPS_ENABLED.map(function (o) {
      return '<button class="op" type="button" data-op="' + esc(o) + '" aria-pressed="false" aria-label="' + names[o] + '">' + esc(o) + '</button>';
    }).join('');
  }

  function start() {
    queue = buildQueue(); idx = 0; results = []; score = 0;
    $('play').hidden = false; $('done').hidden = true;
    loadRound();
  }

  function loadRound() {
    sel = { op: OPS_ENABLED.length === 1 ? OPS_ENABLED[0] : null, L: null, R: null, active: 'L' };
    bad = { op: false, L: false, R: false };
    wrong = 0; wrongAge = 0; hintUsed = false; solved = false; followDone = false; fbHtml = ''; fbClass = '';
    $('hint').hidden = true;
    $('ageInput').value = ''; $('ageInput').disabled = false;
    render();
  }

  /* ---------- rendering ---------- */
  function renderProgress() {
    var p = queue[idx];
    var html = '';
    for (var s = 0; s < STAGES.length; s++) {
      var dots = '';
      for (var k = 0; k < STAGE_N[s]; k++) {
        var i = STAGE_START[s] + k;
        var cls = 'dot';
        if (i < idx || (i === idx && followDone)) cls += ' s' + (results[i] || 1);
        else if (i === idx) cls += ' now';
        dots += '<span class="' + cls + '"></span>';
      }
      html += '<div class="stage' + (p.stage === s ? ' active' : '') + '"><div class="stage-lbl">' + STAGES[s].name + '</div><div class="dots">' + dots + '</div></div>';
    }
    $('stages').innerHTML = html;
    $('stageLine').textContent = STAGES[p.stage].line;
  }

  function renderSlot(side) {
    var p = queue[idx];
    var el = side === 'L' ? $('slotL') : $('slotR');
    var e = sel[side];
    el.className = 'side';
    if (e) {
      el.classList.add('filled');
      if (exText(e).length > 2) el.classList.add('long');
      el.innerHTML = '<span class="sym">' + exText(e) + '</span><span class="cap">' + capText(e, p) + '</span>';
    } else {
      el.classList.add('empty');
      el.innerHTML = '<span class="sym">?</span><span class="cap">' + (sel.active === side ? 'pick below' : 'tap to fill') + '</span>';
    }
    var isActive = sel.active === side && !solved;
    if (isActive) el.classList.add('active');
    if (solved) { el.classList.remove('filled'); el.classList.add('good'); }
    else if (bad[side]) { el.classList.remove('filled'); el.classList.add('bad'); }
    el.setAttribute('aria-pressed', String(isActive));
    el.disabled = solved;
  }

  function renderSeesaw() {
    var theta = sel.op === '>' ? -8 : sel.op === '<' ? 8 : 0;
    var rad = theta * Math.PI / 180, r = 100;
    $('beam').style.transform = 'rotate(' + theta + 'deg)';
    $('panL').style.transform = 'translate(' + (180 - r * Math.cos(rad)) + 'px,' + (96 - r * Math.sin(rad)) + 'px)';
    $('panR').style.transform = 'translate(' + (180 + r * Math.cos(rad)) + 'px,' + (96 + r * Math.sin(rad)) + 'px)';
    ['L', 'R'].forEach(function (side) {
      var pan = side === 'L' ? $('panL') : $('panR');
      var e = sel[side];
      var t = pan.querySelector('text');
      var txt = e ? exText(e) : '?';
      t.textContent = txt;
      t.style.fontSize = txt.length > 6 ? '14px' : txt.length > 2 ? '17px' : '22px';
      pan.classList.toggle('unknown', !e);
    });
  }

  function render() {
    var p = queue[idx];
    $('score').textContent = score;
    renderProgress();
    $('roundTag').textContent = 'Question ' + (idx + 1) + ' of ' + TOTAL;
    $('lead').textContent = p.lead;
    $('lead').hidden = !p.lead;
    $('story').innerHTML = p.story;
    $('legend').innerHTML = p.vars.map(function (v) {
      return '<li><b>' + v.v + '</b>' + v.name + "'s " + p.item[1] + (v.known ? ' = ' + v.known : '') + '</li>';
    }).join('');

    renderSlot('L'); renderSlot('R');

    var ops = $('ops');
    ops.classList.toggle('bad', bad.op);
    ops.classList.toggle('good', solved);
    Array.prototype.forEach.call(ops.querySelectorAll('.op'), function (b) {
      b.setAttribute('aria-pressed', String(sel.op === b.getAttribute('data-op')));
      b.disabled = solved;
    });

    $('pickLabel').textContent = 'Pick the ' + (sel.active === 'L' ? 'left' : 'right') + ' expression';
    $('pickerWrap').hidden = solved;
    renderFollow();
    $('chips').innerHTML = p.pool.map(function (o, i) {
      var on = sameEx(sel.L, o) || sameEx(sel.R, o);
      var t = exText(o);
      var cap = (o.v && !o.k) ? '<span class="cap">' + nameOf(p, o.v) + '</span>' : '';
      return '<button class="chip' + (t.length > 2 ? ' long' : '') + '" type="button" data-i="' + i + '" aria-pressed="' + on + '"' + (solved ? ' disabled' : '') + '><span class="sym">' + t + '</span>' + cap + '</button>';
    }).join('');

    renderSeesaw();

    var fb = $('fb');
    fb.className = 'feedback ' + fbClass;
    fb.innerHTML = fbHtml;

    var main = $('mainBtn');
    var inFollow = solved && !followDone;
    main.textContent = followDone ? (idx === TOTAL - 1 ? 'See results' : 'Next question') : inFollow ? 'Check number' : 'Check';
    main.disabled = inFollow ? $('ageInput').value.trim() === '' : !solved && !(sel.op && sel.L && sel.R);
    $('hintBtn').disabled = solved;
    $('clearBtn').disabled = solved || (!sel.L && !sel.R && (OPS_ENABLED.length === 1 || !sel.op));
  }

  function renderFollow() {
    var box = $('follow');
    var p = queue[idx], f = p.follow;
    box.hidden = !(solved && f);
    if (box.hidden) return;
    var gn = nameOf(p, f.given), an = nameOf(p, f.ask);
    var iw = p.item[1];
    $('followQ').textContent = f.mode === 'known'
      ? gn + ' has ' + yrs(p.item, f.value) + ', as the story says. How many ' + iw + ' does ' + an + ' have?'
      : 'If ' + gn + ' has ' + yrs(p.item, f.value) + ', how many ' + iw + ' does ' + an + ' have?';
    $('ageLabel').textContent = an + ' has';
    $('ageUnit').textContent = iw;
    $('ageInput').disabled = followDone;
  }

  function shakeEl(el) {
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
  }

  /* ---------- actions ---------- */
  function pickOp(op) {
    if (solved || OPS_ENABLED.length === 1 || OPS_ENABLED.indexOf(op) < 0) return;
    sel.op = sel.op === op ? null : op;
    bad.op = false;
    render();
  }

  function pickChip(i) {
    if (solved) return;
    var o = queue[idx].pool[i];
    if (!o) return;
    var a = sel.active;
    if (sameEx(sel[a], o)) {
      sel[a] = null;
    } else {
      sel[a] = o;
      var other = a === 'L' ? 'R' : 'L';
      if (!sel[other]) sel.active = other;
    }
    bad[a] = false;
    render();
  }

  function pickSlot(side) {
    if (solved) return;
    if (sel.active === side && sel[side]) { sel[side] = null; bad[side] = false; }
    else sel.active = side;
    render();
  }

  function finishRound() {
    followDone = true;
    var s = Math.max(1, 3 - wrong - (hintUsed ? 1 : 0) - Math.min(1, wrongAge));
    results[idx] = s;
    score += s * 10;
    return s;
  }

  function checkAge() {
    if (!solved || followDone) return;
    var p = queue[idx], f = p.follow;
    var raw = $('ageInput').value.trim();
    if (!/^\d+$/.test(raw)) {
      fbClass = 'bad'; fbHtml = 'Type the number as a whole number.';
      render();
      return;
    }
    if (parseInt(raw, 10) === f.answer) {
      var s = finishRound();
      fbClass = 'good';
      fbHtml = 'Yes, ' + nameOf(p, f.ask) + ' has ' + yrs(p.item, f.answer) + '. <span class="stars" aria-label="' + s + ' of 3 stars">' + stars(s) + '</span>';
      render();
    } else {
      wrongAge++;
      fbClass = 'bad';
      fbHtml = 'Not quite. Put the number into your equation, then work out the other amount.';
      render();
      shakeEl($('followRow'));
    }
  }

  function clearAll() {
    if (solved) return;
    sel = { op: OPS_ENABLED.length === 1 ? OPS_ENABLED[0] : null, L: null, R: null, active: 'L' };
    bad = { op: false, L: false, R: false };
    fbHtml = ''; fbClass = '';
    render();
  }

  function check() {
    if (solved || !sel.op || !sel.L || !sel.R) return;
    var p = queue[idx];
    if (isCorrect(p, sel.L, sel.op, sel.R)) {
      solved = true;
      bad = { op: false, L: false, R: false };
      fbClass = 'good';
      var made = '<span class="eqn">' + esc(exText(sel.L) + ' ' + sel.op + ' ' + exText(sel.R)) + '</span> ' + esc(reading(p, sel.L, sel.op, sel.R));
      if (p.follow) {
        fbHtml = made + ' Now use it to find an amount.';
      } else {
        var s0 = finishRound();
        fbHtml = made + ' <span class="stars" aria-label="' + s0 + ' of 3 stars">' + stars(s0) + '</span>';
      }
      render();
      return;
    }
    wrong++;
    var L = sel.L, R = sel.R, op = sel.op;
    var opFix = OPS_ENABLED.some(function (o) { return o !== op && isCorrect(p, L, o, R); });
    var leftFix = p.pool.some(function (x) { return isCorrect(p, x, op, R); });
    var rightFix = p.pool.some(function (x) { return isCorrect(p, L, op, x); });
    bad = { op: false, L: false, R: false };
    if (opFix) {
      bad.op = true;
      fbHtml = 'Your two expressions are right, but the symbol is not.';
    } else if (leftFix && rightFix) {
      bad.L = true; bad.R = true;
      fbHtml = 'Not quite. Check both expressions.';
    } else if (leftFix) {
      bad.L = true;
      fbHtml = 'The symbol and your right side can work. Try a different left side.';
    } else if (rightFix) {
      bad.R = true;
      fbHtml = 'The symbol and your left side can work. Try a different right side.';
    } else {
      fbHtml = 'Not quite. Read the story again, then check both sides and the symbol.';
    }
    fbClass = 'bad';
    render();
    if (bad.op) shakeEl($('ops'));
    if (bad.L) shakeEl($('slotL'));
    if (bad.R) shakeEl($('slotR'));
    if (!bad.op && !bad.L && !bad.R) shakeEl($('eq'));
  }

  function next() {
    if (idx === TOTAL - 1) { finish(); return; }
    idx++;
    loadRound();
  }

  function toggleHint() {
    var h = $('hint');
    if (!h.hidden) { h.hidden = true; return; }
    hintUsed = true;
    h.textContent = HINTS[queue[idx].stage] + ' Using a hint takes one star off this question.';
    h.hidden = false;
  }

  function finish() {
    $('play').hidden = true; $('done').hidden = false;
    var stageStars = [0, 0, 0], all = 0;
    results.forEach(function (s, i) { stageStars[i < 3 ? 0 : i < 7 ? 1 : 2] += s; all += s; });
    var ratio = all / (TOTAL * 3);
    $('doneTitle').textContent = ratio >= 0.93 ? 'Perfectly balanced.' : ratio >= 0.75 ? 'Well balanced.' : ratio >= 0.5 ? 'Getting steady.' : 'Keep practising, you are close.';
    $('doneScore').textContent = score;
    $('breakdown').innerHTML = STAGES.map(function (s, i) {
      return '<li><span>' + s.name + '</span><span>' + stageStars[i] + ' of ' + (STAGE_N[i] * 3) + ' stars</span></li>';
    }).join('');
    var best = score;
    try {
      var prev = parseInt(localStorage.getItem(BEST_KEY), 10);
      if (prev > score) best = prev;
      localStorage.setItem(BEST_KEY, String(best));
    } catch (e) {}
    $('best').textContent = best > score ? 'Your best score on this device is ' + best + '.' : 'This is your best score on this device.';
    $('score').textContent = score;
    $('sent').textContent = 'Your result (1 / 1) has been sent.';
    push();
  }

  /* ---------- result submission (same code as Integer Tetris) ---------- */
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypo-5ThjzEFYh1t-dlCp94v01kU1wpxnu1WCNKLDgxfA3KXuN8Nh7c_XdiBqhTAfyxGA/exec", QUIZ_NAME = "Complete the Equation";
  var me = null, startT = 0;
  function submitResult(data) {
    var fr = document.getElementById('submissionFrame');
    if (!fr) { fr = document.createElement('iframe'); fr.name = fr.id = 'submissionFrame'; fr.style.display = 'none'; fr.setAttribute('aria-hidden', 'true'); document.body.appendChild(fr); }
    var f = document.createElement('form'); f.method = 'POST'; f.action = APPS_SCRIPT_URL; f.target = 'submissionFrame'; f.style.display = 'none';
    Object.keys(data).forEach(function (k) { var i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = data[k]; f.appendChild(i); });
    document.body.appendChild(f); f.submit(); f.remove();
  }
  function push() {
    if (!me) return;
    var secs = Math.max(0, Math.round((Date.now() - startT) / 1000)), tf = Math.floor(secs / 60) + ':' + ('0' + secs % 60).slice(-2);
    submitResult({ name: me.n, class: me.c, Class: me.c, className: me.c, studentClass: me.c, phone: '', Phone: '', quiz: QUIZ_NAME, score: '1', total: '1', percentage: '100.0', timeTaken: String(secs), timeFormatted: tf, q1: 'Correct', topicsCorrect: 'Game clear', topicsRevise: '' });
  }

  /* ---------- events ---------- */
  $('ops').addEventListener('click', function (e) {
    var b = e.target.closest('.op');
    if (b) pickOp(b.getAttribute('data-op'));
  });
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (b) pickChip(parseInt(b.getAttribute('data-i'), 10));
  });
  $('slotL').addEventListener('click', function () { pickSlot('L'); });
  $('slotR').addEventListener('click', function () { pickSlot('R'); });
  $('mainBtn').addEventListener('click', function () { if (!solved) check(); else if (!followDone) checkAge(); else next(); });
  $('ageInput').addEventListener('input', function () { this.value = this.value.replace(/\D/g, ''); $('mainBtn').disabled = this.value === ''; });
  $('hintBtn').addEventListener('click', toggleHint);
  $('clearBtn').addEventListener('click', clearAll);
  $('again').addEventListener('click', start);

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || $('play').hidden) return;
    var k = e.key;
    if (e.target && e.target.tagName === 'INPUT') {
      if (k === 'Enter') { e.preventDefault(); checkAge(); }
      return;
    }
    if (k === '<' || k === '>' || k === '=') { pickOp(k); return; }
    if (k >= '1' && k <= '8') { pickChip(parseInt(k, 10) - 1); return; }
    if (k === 'Enter' && e.target.tagName !== 'BUTTON') {
      if (!solved) check(); else if (!followDone) checkAge(); else next();
    }
  });

  var nm = $('nm'), cl = $('cl'), er = $('er');
  try { nm.value = localStorage.getItem('hw-name') || ''; cl.value = localStorage.getItem('hw-cls') || ''; } catch (e) {}
  cl.addEventListener('input', function () { cl.value = cl.value.replace(/\D/g, ''); });
  $('startBtn').addEventListener('click', function () {
    var n = nm.value.trim(), c = cl.value.trim();
    if (!n) { er.textContent = 'Please enter your name.'; nm.focus(); return; }
    if (!/^\d{1,2}$/.test(c)) { er.textContent = 'Please enter your class as a number, e.g. 7.'; cl.focus(); return; }
    me = { n: n, c: c };
    try { localStorage.setItem('hw-name', n); localStorage.setItem('hw-cls', c); } catch (e) {}
    $('ov').style.display = 'none'; er.textContent = '';
    startT = Date.now();
    start();
  });
  $('again').addEventListener('click', function () { startT = Date.now(); });
  buildOps();
  queue = buildQueue(); renderProgress();
})();
</script>

</body></html>
